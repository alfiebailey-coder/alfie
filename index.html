<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfie Bailey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300&display=swap">
<style>
:root{--navy:#0a1128;--char:#24272c;--plat:#d6d9de;--white:#fff;--line:rgba(214,217,222,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0a1128}}
:root[data-theme="dark"]{--navy:#0a1128}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--char)}
body{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:200;color:var(--plat);background:linear-gradient(var(--char),#1b1d21);overflow-x:hidden}
section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 28px;position:relative}
/* hero */
#hero{background:linear-gradient(#050914 0%,var(--navy) 55%,#1a2238 78%,var(--char) 100%);overflow:hidden;padding:0 28px}
#hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero-text{position:relative;z-index:2;margin-top:-6vh}
h1{font-weight:200;font-size:clamp(2rem,6.5vw,5.2rem);letter-spacing:.42em;text-indent:.42em;color:var(--white);text-transform:uppercase}
.loc{margin-top:34px;font-weight:200;font-size:.8rem;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--plat);opacity:.8}
.cue{position:absolute;bottom:36px;left:50%;width:1px;height:56px;background:linear-gradient(var(--plat),transparent);z-index:2;animation:cue 2.4s ease-in-out infinite}
@keyframes cue{50%{opacity:.25;transform:translateY(8px)}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
/* card */
.card{width:min(620px,100%);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:64px;padding:72px 64px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(10,17,40,.85),rgba(36,39,44,.6));box-shadow:0 50px 120px rgba(0,0,0,.55);text-align:left}
.badge{width:112px;height:112px;border-radius:50%;border:1px solid var(--plat);display:grid;place-items:center;font-size:1.6rem;font-weight:200;letter-spacing:.3em;text-indent:.3em;color:var(--white);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),transparent 65%)}
.links{list-style:none;padding:0;display:grid;gap:34px}
.links a{color:var(--plat);text-decoration:none;font-size:.82rem;letter-spacing:.32em;text-transform:uppercase;font-weight:300;padding-bottom:6px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.links a:hover{color:var(--white);border-color:var(--plat)}
/* contact */
h2{font-weight:200;font-size:clamp(1.8rem,4.5vw,3.2rem);letter-spacing:.38em;text-indent:.38em;color:var(--white);text-transform:uppercase}
.dock{margin-top:96px;width:min(520px,100%);display:grid;gap:88px}
.field{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);transition:border-color .3s}
.field:focus-within{border-color:var(--white)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--white);font:300 1rem 'Inter','Helvetica Neue',Arial,sans-serif;letter-spacing:.12em;padding:14px 0}
input::placeholder{color:rgba(214,217,222,.5)}
.field button{background:none;border:0;color:var(--plat);cursor:pointer;font:300 .75rem 'Inter',Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;padding:14px 0;transition:color .3s}
.field button:hover{color:var(--white)}
.mail{color:var(--white);text-decoration:none;font-weight:300;font-size:clamp(1rem,2.6vw,1.4rem);letter-spacing:.24em;padding-bottom:10px;border-bottom:1px solid var(--plat);transition:letter-spacing .4s,border-color .4s}
.mail:hover{letter-spacing:.3em;border-color:var(--white)}
footer{text-align:center;padding:40px 28px calc(56px + env(safe-area-inset-bottom,0px));font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(214,217,222,.5)}
@media(max-width:640px){.card{grid-template-columns:1fr;justify-items:center;text-align:center;gap:48px;padding:56px 28px}.links{justify-items:center}h1{letter-spacing:.28em;text-indent:.28em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<section id="hero">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><radialGradient id="h"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <g fill="#fff" opacity=".55"><circle cx="160" cy="120" r="1.2"/><circle cx="420" cy="200" r="1"/><circle cx="900" cy="90" r="1.3"/><circle cx="1240" cy="170" r="1"/><circle cx="1480" cy="80" r="1.2"/><circle cx="700" cy="150" r="1"/></g>
    <circle cx="1130" cy="270" r="230" fill="url(#h)"/>
    <circle cx="1130" cy="270" r="72" fill="#f4f6fa"/>
    <path d="M0 640 L180 560 L330 600 L560 470 L760 560 L930 500 L1150 420 L1330 520 L1480 470 L1600 520 V900 H0Z" fill="#3a4357" opacity=".75"/>
    <path d="M0 700 L240 640 L470 690 L720 610 L960 680 L1200 620 L1420 680 L1600 640 V900 H0Z" fill="#232c43"/>
    <path d="M0 770 L300 720 L620 760 L940 715 L1260 755 L1600 720 V900 H0Z" fill="#141c33"/>
    <path d="M0 830 L400 800 L800 825 L1200 795 L1600 820 V900 H0Z" fill="#1c2027"/>
    <rect y="860" width="1600" height="40" fill="#24272c"/>
  </svg>
  <div class="hero-text"><h1 class="reveal">Alfie Bailey</h1><p class="loc reveal">Specialist</p></div>
  <div class="cue" aria-hidden="true"></div>
</section>

<section id="identity">
  <div class="card reveal">
    <div class="badge" aria-label="AB emblem">AB</div>
    <ul class="links">
      <li><a href="#identity">Selected Projects</a></li>
      <li><a href="#identity">Digital Work</a></li>
      <li><a href="#contact">Contact Desk</a></li>
    </ul>
  </div>
</section>

<section id="contact">
  <h2 class="reveal">Get in Touch.</h2>
  <div class="dock reveal">
    <form class="field" id="f"><input id="m" placeholder="Your name &amp; message" autocomplete="off" aria-label="Your name and message"><button type="submit">Send</button></form>
    <div><a class="mail" href="mailto:contact@alfiebailey.com">contact@alfiebailey.com</a></div>
  </div>
</section>

<footer>&copy; <span id="y">2026</span> Alfie Bailey</footer>

<script>
document.getElementById('y').textContent=new Date().getFullYear();
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.2});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
location.href='mailto:contact@alfiebailey.com?subject='+encodeURIComponent('Hello Alfie')+'&body='+encodeURIComponent(document.getElementById('m').value)});
</script>
</body>
</html>
